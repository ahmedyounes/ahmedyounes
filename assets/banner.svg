<?xml version="1.0" encoding="UTF-8"?>
<!--
  Hero banner for GitHub profile README — Ahmed Younes · Solopreneur & FDE
  - Self-contained, SMIL animation only (no JS, no CSS keyframes, no external fonts/images).
  - All text fully visible at rest; animation is enhancement only.
  - Matches the LinkedIn cover: "deploy pipeline" from vet clinic to FDE.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Ahmed Younes — Solopreneur &amp; Forward-Deployed Engineer. Path: vet clinic, pharma, Vet Med Tech, EatNShred, starmakkah, FDE.">

  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D1117"/>
      <stop offset="1" stop-color="#090C10"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="42%" r="75%">
      <stop offset="0" stop-color="#0D1117" stop-opacity="0"/>
      <stop offset="1" stop-color="#05070A" stop-opacity="0.85"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 L0 40" fill="none" stroke="#161B22" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="1200" height="300" fill="url(#vignette)"/>

  <!-- Left accent rail -->
  <rect x="40" y="40" width="3" height="162" rx="1.5" fill="#E3B341" opacity="0.55"/>

  <g font-family="'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace">

    <!-- ===================== TEXT BLOCK ===================== -->
    <text x="80" y="62" font-size="17" letter-spacing="1.5" xml:space="preserve"><tspan fill="#E3B341">~/ahmedyounes</tspan><tspan fill="#8B949E"> $ </tspan><tspan fill="#F4ECD8">deploy --forward </tspan><tspan fill="#E3B341">&#9608;<animate attributeName="fill-opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.5;1;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>

    <text x="78" y="128" font-size="58" font-weight="700" letter-spacing="8" fill="#F4ECD8">AHMED YOUNES</text>

    <text x="80" y="168" font-size="24" font-weight="700" letter-spacing="1.5" fill="#E3B341">Solopreneur &amp; Forward-Deployed Engineer</text>

    <text x="80" y="196" font-size="15" letter-spacing="0.5" fill="#8B949E">I go where the problem is <tspan fill="#6E7681">— and ship the system that solves it.</tspan></text>

    <!-- ===================== CORNER TAG ===================== -->
    <g opacity="0.85">
      <path d="M967 38 c0 6 -7 12 -7 12 s-7 -6 -7 -12 a7 7 0 0 1 14 0 z" fill="none" stroke="#8B949E" stroke-width="1.4"/>
      <circle cx="960" cy="38" r="2.3" fill="#8B949E"/>
      <text x="980" y="44" font-size="14" letter-spacing="1" fill="#8B949E">Alexandria, Egypt</text>
    </g>

    <!-- ===================== PIPELINE ===================== -->
    <!-- track -->
    <rect x="86" y="235" width="1028" height="2" fill="#2A3240"/>
    <!-- progress fill: draws across, holds, resets -->
    <rect x="86" y="235" width="0" height="2" fill="#E3B341" opacity="0.7">
      <animate attributeName="width" values="0;0;1028;1028" keyTimes="0;0.06;0.55;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- stage nodes -->
    <g fill="#0D1117" stroke="#4A5466" stroke-width="2">
      <circle cx="86"  cy="236" r="7"/>
      <circle cx="292" cy="236" r="7"/>
      <circle cx="497" cy="236" r="7"/>
      <circle cx="703" cy="236" r="7"/>
      <circle cx="908" cy="236" r="7"/>
    </g>

    <!-- FDE node: always lit, pulses gently -->
    <circle cx="1114" cy="236" r="14" fill="#E3B341" opacity="0.18">
      <animate attributeName="r" values="11;17;11" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.25;0.05;0.25" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1114" cy="236" r="8" fill="#E3B341" filter="url(#softGlow)"/>

    <!-- travelling packet -->
    <circle cx="86" cy="236" r="4" fill="#F4ECD8" opacity="0">
      <animate attributeName="cx" values="86;86;1114;1114" keyTimes="0;0.06;0.55;1" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0;0" keyTimes="0;0.06;0.53;0.56;1" dur="9s" repeatCount="indefinite"/>
    </circle>

    <!-- stage labels -->
    <g font-size="14" fill="#8B949E" letter-spacing="0.5">
      <text x="80"  y="272">vet clinic</text>
      <text x="292" y="272" text-anchor="middle">pharma</text>
      <text x="497" y="272" text-anchor="middle">vet med tech</text>
      <text x="703" y="272" text-anchor="middle">eatnshred</text>
      <text x="908" y="272" text-anchor="middle">starmakkah</text>
    </g>
    <text x="1122" y="272" text-anchor="end" font-size="14" font-weight="700" fill="#E3B341" letter-spacing="0.5">fde &#9656; now</text>
  </g>

</svg>
